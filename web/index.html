<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CasePrep Local</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>CasePrep Local</h1>
      <div id="provider-status" class="status">provider: —</div>
    </header>

    <section id="library">
      <div class="library-head">
        <h2>Library</h2>
        <span>
          <button id="drills-btn" class="link">🔢 Mental math</button>
          <button id="flashcards-btn" class="link">🧠 Benchmarks</button>
          <button id="dashboard-btn" class="link">📊 Progress</button>
        </span>
      </div>
      <div id="content-list">Loading…</div>
    </section>

    <section id="drills" hidden>
      <button id="drills-back" class="link">← library</button>
      <form id="drills-form"></form>
      <div id="drills-result"></div>
    </section>

    <section id="dashboard" hidden>
      <button id="dash-back" class="link">← library</button>
      <div id="dash-body"></div>
    </section>

    <main id="session" hidden>
      <button id="quit-btn" class="link">← library</button>
      <div id="view"></div>
      <div id="transcript"></div>
      <form id="composer">
        <input id="message" placeholder="your response…" autocomplete="off" />
        <button id="mic" type="button" title="Hold to talk">🎤</button>
        <button type="submit">Send</button>
      </form>
      <div id="number-confirm" hidden></div>
      <div id="controls"></div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
