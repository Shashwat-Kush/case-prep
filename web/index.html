<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CasePrep Local</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header><h1>CasePrep Local</h1></header>

    <section id="library">
      <h2>Library</h2>
      <div id="content-list">Loading…</div>
    </section>

    <main id="session" hidden>
      <button id="quit-btn" class="link">← library</button>
      <div id="view"></div>
      <div id="transcript"></div>
      <form id="composer">
        <input id="message" placeholder="your response…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
      <div id="controls"></div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
